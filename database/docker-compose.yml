version: '3.8'

services: 
  postgres: 
    image: postgres:14
    container_name: postgres-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: miguel
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: habit-challenge
    volumes:
      - postgres-data:/var/lib/postgresql/data
    
volumes:
  postgres-data: